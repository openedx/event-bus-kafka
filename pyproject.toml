[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edx-event-bus-kafka"
description = "Kafka implementation for Open edX event bus."
requires-python = ">=3.12"
license = "AGPL-3.0"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "Python",
    "edx",
]

dynamic = ["readme", "version"]

dependencies = [
    "Django>=4.2",
    "openedx-events>=9.3.0",
    "edx-django-utils",
    "edx-toggles",
]

[project.urls]
Homepage = "https://github.com/openedx/event-bus-kafka"
Repository = "https://github.com/openedx/event-bus-kafka"

[dependency-groups]
# Base test packages, no Django version pinned
test-base = [
    "pytest-cov",
    "pytest-django",
    "code-annotations",
    "confluent-kafka[avro,schema-registry]",
    "ddt",
]
# Default test group: current supported Django version
test = [
    {include-group = "test-base"},
    "Django>=5.2,<6.0",
]
# Legacy Django 4.2 support
django42 = [
    {include-group = "test-base"},
    "Django>=4.2,<4.3",
]
quality = [
    {include-group = "test"},
    "edx-lint",
    "isort",
    "pycodestyle",
    "pydocstyle",
    "twine",
]
doc = [
    {include-group = "test"},
    "doc8",
    "sphinx-book-theme",
    "twine",
    "build",
    "Sphinx",
]
ci = [
    {include-group = "test"},
    {include-group = "quality"},
    "tox",
    "tox-uv",
]
dev = [
    {include-group = "quality"},
    {include-group = "ci"},
    {include-group = "doc"},
    "diff-cover",
    "edx-i18n-tools",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGELOG.rst"], content-type = "text/x-rst"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["edx_event_bus_kafka", "edx_event_bus_kafka.*"]
exclude = ["*tests"]

[tool.setuptools.exclude-package-data]
"*" = ["tests*", "*.tests*", "spec*", "*.spec*"]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.semantic_release]
build_command = "python -m pip install --upgrade build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"
major_on_zero = false
allow_zero_version = true
tag_format = "v{version}"

[tool.uv]
package = true
conflicts = [
    [
        {group = "test"},
        {group = "django42"},
    ],
]
# DO NOT EDIT constraint-dependencies DIRECTLY.
# This list is managed by `edx_lint write_uv_constraints`
# and will be overwritten the next time `make upgrade` is run.
#  - GLOBAL constraints: edit edx_lint/files/common_constraints.txt
#  - REPO-SPECIFIC constraints: edit [tool.edx_lint].uv_constraints in this file
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "openedx-events<11.1.1",
    "confluent-kafka<2.15.0",
]

[tool.edx_lint]
uv_constraints = [
    # openedx-events>=11.1.1 removed openedx_events.event_bus.avro.tests.test_utilities
    # (dropped test files from its wheel as part of its own tooling modernization), but
    # this repo's test suite imports SubTestData0/create_simple_signal from it directly
    # in src/edx_event_bus_kafka/internal/tests/test_producer.py. Pin below that version
    # until the test suite is updated to stop relying on an upstream package's internal
    # test utilities (tracked as a follow-up, see PR description).
    "openedx-events<11.1.1",
    # confluent-kafka>=2.15.0 bundles a newer librdkafka that assigns a name
    # (INVALID_SHARE_SESSION_EPOCH, from KIP-932 share groups) to error code 123,
    # which src/edx_event_bus_kafka/internal/tests/test_consumer.py::test_check_event_error
    # relies on being unrecognized to exercise its "unknown error code" formatting path.
    # Pin until that test is made robust to librdkafka's error-code table changing over
    # time (tracked as a follow-up, see PR description).
    "confluent-kafka<2.15.0",
]

[tool.isort]
include_trailing_comma = true
indent = "    "
line_length = 120
multi_line_output = 3

[tool.coverage.run]
branch = true
source = ["src/edx_event_bus_kafka"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/settings.py",
    "*/admin.py",
    "*/static/*",
    "*/templates/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"
